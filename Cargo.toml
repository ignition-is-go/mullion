[package]
name = "mullion"
version = "0.1.0"
edition = "2021"
description = "A Leptos library for splittable panes with activity bars"

[package.metadata.flux]
# Which flux tasks touch this crate. `publish` is deliberately absent: the
# `mullion` name is squatted on crates.io, so this crate is consumed by path
# or git dependency only.
tasks = ["check", "check-wasm", "build", "test", "lint"]

[dependencies]
leptos = { version = "0.8.17", features = ["csr"] }
send_wrapper = "0.6.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
css-styled = { git = "https://github.com/ignition-is-go/css-styled.git", version = "0.1.0" }
leptos-resize-handle = "0.1.0"
web-sys = { version = "0.3", features = [
    "DragEvent",
    "DataTransfer",
    "MouseEvent",
    "HtmlElement",
    "Element",
    "DomRect",
    "CssStyleDeclaration",
    "Document",
    "Window",
    "EventTarget",
] }

[workspace]
