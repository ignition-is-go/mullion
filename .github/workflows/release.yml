name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_FLUX_VERSION: "0.4.4"

jobs:
  release:
    name: Stamp, tag, and publish
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main'
      )
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30

    steps:
      - name: Checkout main with full history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-flux
        run: cargo install cargo-flux --version "$CARGO_FLUX_VERSION" --locked

      - name: Prepare release
        id: prepare
        env:
          EVENT_NAME: ${{ github.event_name }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          SUBJECT="$(git log -1 --format=%s)"
          case "$SUBJECT" in
            "chore(release): v"*)
              TAG="${SUBJECT#chore(release): }"
              git rev-parse "$TAG" >/dev/null
              echo "Release commit already exists; ensuring $TAG has a GitHub release."
              echo "tag=$TAG" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac

          if [ "$EVENT_NAME" = "workflow_run" ] && [ "$(git rev-parse HEAD)" != "$TESTED_SHA" ]; then
            echo "main advanced after the tested commit; its newer CI run will release it."
            exit 0
          fi

          VERSION="$(cargo flux version)"
          if [ -z "$VERSION" ]; then
            echo "No release-worthy conventional commits since the latest tag."
            exit 0
          fi
          TAG="v$VERSION"

          cargo flux stamp "$VERSION"
          cargo check --workspace
          cargo fmt --all -- --check

          while IFS= read -r FILE; do
            case "$FILE" in
              Cargo.toml|Cargo.lock) ;;
              *)
                echo "Unexpected release-stamp change: $FILE" >&2
                exit 1
                ;;
            esac
          done < <(git diff --name-only)

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock
          git commit -m "chore(release): $TAG"
          git tag "$TAG" -m "Release $VERSION"
          git push --atomic origin HEAD:main "$TAG"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        if: steps.prepare.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.prepare.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG already has a GitHub release."
          else
            gh release create "$TAG" \
              --verify-tag \
              --title "$TAG" \
              --generate-notes \
              --latest
          fi
