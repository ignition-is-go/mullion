name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_FLUX_VERSION: "0.12.0"

jobs:
  validate:
    name: native, wasm, and demo
    runs-on: ["self-hosted", "Linux", "X64", "ram-ge-16g", "disk-ge-100g"]
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: ignition-is-go/pulse-actions/actions/setup-rust@9a22a3c3987bfa13c1619f6bc3ff14de893e35e8
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
          cache-workspaces: |
            . -> target
            examples/demo -> examples/demo/target
          cache-shared-key: mullion-ci-v1
          compiler-cache-endpoint: ${{ secrets.CI_CACHE_ENDPOINT }}
          compiler-cache-bucket: ${{ secrets.CI_CACHE_BUCKET }}
          compiler-cache-access-key: ${{ secrets.CI_CACHE_ACCESS_KEY }}
          compiler-cache-secret-key: ${{ secrets.CI_CACHE_SECRET_KEY }}

          cache-save-if: ${{ env.CI_NATIVE_CACHE_CONFIGURED != 'true' }}
      - name: Install native build dependencies
        run: sudo sed -i 's|http://|https://|g' /etc/apt/sources.list.d/ubuntu.sources && sudo apt-get update && sudo apt-get install -y build-essential pkg-config

      - name: Set up Cargo Flux and ROSE cache
        uses: ignition-is-go/cargo-flux@ae2ffa5f4420add3ab3c98665a4b5c0374bf2a5b
        with:
          version: 0.12.0
          cache: ${{ env.CI_NATIVE_CACHE_CONFIGURED == 'true' && 's3' || '' }}
          cache-endpoint: ${{ vars.CI_CACHE_S3_ENDPOINT || secrets.CI_CACHE_ENDPOINT }}
          cache-bucket: ${{ vars.CI_CACHE_S3_BUCKET || secrets.CI_CACHE_BUCKET }}
          cache-access-key-id: ${{ secrets.CI_CACHE_S3_ACCESS_KEY_ID || secrets.CI_CACHE_ACCESS_KEY }}
          cache-secret-access-key: ${{ secrets.CI_CACHE_S3_SECRET_ACCESS_KEY || secrets.CI_CACHE_SECRET_KEY }}
      - name: Restore ROSE compiler snapshot
        id: compiler-snapshot
        if: env.CI_NATIVE_CACHE_CONFIGURED == 'true'
        uses: ignition-is-go/pulse-actions/actions/flux-target-cache@9a22a3c3987bfa13c1619f6bc3ff14de893e35e8
        with:
          operation: restore
          scope: validate
          plugin: cargo
          plugin-options: "manifest-path=Cargo.toml\nmanifest-path=examples/demo/Cargo.toml"
      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check native target
        run: cargo flux run check

      - name: Check wasm target
        run: cargo flux run check-wasm

      - name: Lint
        run: cargo flux run lint

      - name: Test
        run: cargo flux run test

      - name: Install Trunk
        run: command -v trunk >/dev/null || cargo install trunk --version 0.21.14 --locked

      - name: Build demo
        working-directory: examples/demo
        run: env -u NO_COLOR trunk build --release

      - name: Save ROSE snapshot and clean local Cargo targets
        if: success() && steps.compiler-snapshot.outputs.state != ''
        uses: ignition-is-go/pulse-actions/actions/flux-target-cache@9a22a3c3987bfa13c1619f6bc3ff14de893e35e8
        with:
          operation: save
          state: ${{ steps.compiler-snapshot.outputs.state }}
    env:
      CI_NATIVE_CACHE_CONFIGURED: ${{ (secrets.CI_CACHE_S3_ACCESS_KEY_ID || secrets.CI_CACHE_ACCESS_KEY) != '' }}
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
  release:
    name: stamp, tag, and publish
    needs: validate
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: write # Push the version commit/tag and create the GitHub release.
    runs-on: {group: ci-untrusted, labels: [self-hosted, Linux, X64, ram-ge-16g, disk-ge-100g]}
    timeout-minutes: 30

    steps:
      - name: Checkout main with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Install Rust toolchain
        uses: ignition-is-go/pulse-actions/actions/setup-rust@v1.1.1
        with:
          components: rustfmt
          linux-dependencies: build
          cache-shared-key: mullion-release-v1

      - name: Install GitHub CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y gh
          gh --version

      - name: Install cargo-flux
        run: cargo install cargo-flux --version "$CARGO_FLUX_VERSION" --locked

      - name: Prepare release
        id: prepare
        env:
          TESTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          SUBJECT="$(git log -1 --format=%s)"
          case "$SUBJECT" in
            "chore(release): v"*)
              TAG="${SUBJECT#chore(release): }"
              git rev-parse "$TAG" >/dev/null
              echo "Release commit already exists; ensuring $TAG has a GitHub release."
              echo "tag=$TAG" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac

          if [ "$(git rev-parse HEAD)" != "$TESTED_SHA" ]; then
            echo "main advanced after the tested commit; its newer CI run will release it."
            exit 0
          fi

          VERSION="$(cargo flux version)"
          if [ -z "$VERSION" ]; then
            echo "No release-worthy conventional commits since the latest tag."
            exit 0
          fi
          TAG="v$VERSION"

          cargo flux stamp "$VERSION"
          cargo check --workspace
          cargo fmt --all -- --check

          while IFS= read -r FILE; do
            case "$FILE" in
              Cargo.toml|Cargo.lock) ;;
              *)
                echo "Unexpected release-stamp change: $FILE" >&2
                exit 1
                ;;
            esac
          done < <(git diff --name-only)

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock
          git commit -m "chore(release): $TAG"
          git tag "$TAG" -m "Release $VERSION"

          echo "new_release=true" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Push release commit and tag
        if: steps.prepare.outputs.new_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.prepare.outputs.tag }}
        run: |
          gh auth setup-git
          git push --atomic origin HEAD:main "$TAG"

      - name: Create GitHub release
        if: steps.prepare.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.prepare.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG already has a GitHub release."
          else
            gh release create "$TAG" \
              --verify-tag \
              --title "$TAG" \
              --generate-notes \
              --latest
          fi
